# Recover: consolida relatórios JÁ PRONTOS na fila do Radar (não solicita nada).
# Use quando a rodada normal (Atualizar DadosRadar) falhou e o relatório da conta
# ficou pronto depois. O actions_recover.py preserva as linhas das contas que
# falharem — nunca trunca a base.
#
# ⚠️ Havia DOIS workflows com este mesmo nome ("Recuperar DadosRadar"):
# recover_dadosradar.yml e recuperar_dadosradar.yml. Ficava impossível saber qual
# tinha rodado. Este é o único; o outro foi removido em 27/jul/2026.
name: Recuperar DadosRadar

on:
  workflow_dispatch:

# Mesmo grupo do "Atualizar DadosRadar": os dois gravam na aba DadosRadar e nao
# podem rodar juntos. Se a rodada normal estiver no ar, o recover espera.
concurrency:
  group: dados-radar
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    # Recover não faz polling (só baixa o que já está pronto): 60 min sobra.
    timeout-minutes: 60
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install pandas openpyxl gspread google-auth requests securid selenium webdriver-manager

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Criar arquivo de credenciais Google
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Criar arquivos SDTID
        env:
          SDTID_T3729525_B64: ${{ secrets.SDTID_T3729525_B64 }}
          SDTID_T3761125_B64: ${{ secrets.SDTID_T3761125_B64 }}
          SDTID_T3748937_B64: ${{ secrets.SDTID_T3748937_B64 }}
        run: |
          python -c "
          import base64, os
          for var, fname in [
              ('SDTID_T3729525_B64', 'T3729525_001938489117.sdtid'),
              ('SDTID_T3761125_B64', 'T3761125_001938495598.sdtid'),
              ('SDTID_T3748937_B64', 'T3748937_001938491397.sdtid'),
          ]:
              val = os.environ.get(var, '')
              if val:
                  with open(fname, 'wb') as f:
                      f.write(base64.b64decode(val))
                  print(f'OK: {fname}')
              else:
                  print(f'PULANDO: {var} nao configurado')
          "

      - name: Buscar relatórios prontos e subir para Sheets
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python actions_recover.py
