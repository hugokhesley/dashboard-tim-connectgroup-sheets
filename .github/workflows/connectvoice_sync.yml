name: Connect Voice → Sheets Sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sincronizar Extrato de Ligações
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Instalar dependências Python
        run: pip install requests gspread google-auth selenium webdriver-manager

      - name: Instalar ChromeDriver
        run: |
          pip install webdriver-manager
          python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"

      - name: Criar credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Executar sincronização
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CV_USUARIO: ${{ secrets.CV_USUARIO }}
          CV_SENHA: ${{ secrets.CV_SENHA }}
        run: python connectvoice_sync.py

      - name: Remover credentials.json
        if: always()
        run: rm -f credentials.json
