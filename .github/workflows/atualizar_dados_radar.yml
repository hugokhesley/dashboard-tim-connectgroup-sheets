name: Atualizar DadosRadar
on:
  workflow_dispatch:
  schedule:
    # 3 parciais por dia. A rodada tipica leva ~25 min (mediana de 25 execucoes;
    # os ~150 min sao as falhas batendo no GLOBAL_DEADLINE_MIN, nao o caso normal).
    # O Actions atrasa job agendado em ~45 min, entao na pratica a base fica
    # pronta por volta de 07:45, 11:45 e 15:45 BRT.
    - cron: '0 10 * * *'   # 07:00 BRT
    - cron: '0 14 * * *'   # 11:00 BRT
    - cron: '0 18 * * *'   # 15:00 BRT

# Duas rodadas ao mesmo tempo se atropelam: o runner da aba.clear() antes do
# update, entao um overlap deixaria a base truncada ou misturada. Com 3 rodadas
# por dia a janela de colisao triplica (uma rodada ruim chega a 160 min).
# cancel-in-progress: false = a nova ESPERA a anterior terminar, em vez de matar
# uma rodada de 2h que ainda ia gravar a parcial dela no deadline.
# O mesmo grupo vale para o Recuperar DadosRadar, que grava na mesma aba.
concurrency:
  group: dados-radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install pandas openpyxl gspread google-auth requests securid selenium webdriver-manager

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Criar arquivo de credenciais Google
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Criar arquivos SDTID
        env:
          SDTID_T3729525_B64: ${{ secrets.SDTID_T3729525_B64 }}
          SDTID_T3761125_B64: ${{ secrets.SDTID_T3761125_B64 }}
          SDTID_T3748937_B64: ${{ secrets.SDTID_T3748937_B64 }}
        run: python criar_sdtid.py

      - name: Executar atualização
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # Token da t3761125 e vinculado a dispositivo desde 09/2026: sem este
          # ID a seed decifra errado e o OTP e recusado pela TIM sem explicacao.
          RSA_DEVICE_ID_T3761125: ${{ secrets.RSA_DEVICE_ID_T3761125 }}
          PYTHONUNBUFFERED: "1"
        run: |
          python actions_runner.py
